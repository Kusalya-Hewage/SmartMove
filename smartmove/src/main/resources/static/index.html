<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0">

    <title>
        SmartMove - Login
    </title>
    <link
            rel="stylesheet"
            href="/css/login.css?v=31">

</head>


<body>


<div class="login-page">


    <div class="login-wrapper">


        <!-- =====================================================
             BRAND
             ===================================================== -->

        <div class="login-brand">


            <div class="logo-box">
                SM
            </div>


            <h1>
                SmartMove
            </h1>


            <p>
                Transport Management System
            </p>


            <div class="brand-text">

                Manage vehicles, drivers, routes,
                trips and passenger services
                from one platform.

            </div>


        </div>



        <!-- =====================================================
             LOGIN / REGISTER AREA
             ===================================================== -->

        <div class="login-box">


            <!-- =================================================
                 LOGIN PANEL
                 ================================================= -->

            <div
                    id="loginPanel"
                    class="auth-panel">


                <h2>
                    Login
                </h2>


                <p class="subtitle">
                    Sign in to your SmartMove account
                </p>


                <!-- =============================================
                     LOGIN FORM
                     ============================================= -->

                <form id="loginForm">


                    <!-- USERNAME / EMAIL -->

                    <div class="form-group">

                        <label for="username">
                            Username / Email
                        </label>


                        <input
                                type="text"
                                id="username"
                                placeholder="Username or Email"
                                autocomplete="username"
                                required>

                    </div>



                    <!-- PASSWORD -->

                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>


                        <input
                                type="password"
                                id="password"
                                placeholder="Password"
                                autocomplete="current-password"
                                required>

                    </div>



                    <!-- ROLE -->

                    <div class="form-group">

                        <label for="role">
                            Login As
                        </label>


                        <select
                                id="role"
                                required>

                            <option value="">
                                Select Role
                            </option>

                            <option value="ADMIN">
                                Admin
                            </option>

                            <option value="PASSENGER">
                                Passenger
                            </option>

                        </select>

                    </div>



                    <!-- LOGIN BUTTON -->

                    <button
                            type="submit"
                            id="loginButton">

                        Login

                    </button>


                </form>



                <!-- LOGIN MESSAGE -->

                <div
                        id="loginMessage">
                </div>



                <!-- REGISTER LINK -->

                <div class="register-link">

                    <span>
                        Don't have an account?
                    </span>


                    <button
                            type="button"
                            id="showRegisterButton">

                        Register

                    </button>

                </div>


            </div>



            <!-- =================================================
                 REGISTER PANEL
                 ================================================= -->

            <div
                    id="registerPanel"
                    class="auth-panel"
                    style="display: none;">


                <h2>
                    Create Account
                </h2>


                <p class="subtitle">
                    Register for your SmartMove account
                </p>



                <!-- =============================================
                     REGISTER FORM
                     ============================================= -->

                <form id="registerForm">


                    <!-- ROLE -->

                    <div class="form-group">

                        <label for="registerRole">
                            Register As
                        </label>


                        <select
                                id="registerRole"
                                required>

                            <option value="">
                                Select Role
                            </option>

                            <option value="ADMIN">
                                Admin
                            </option>

                            <option value="PASSENGER">
                                Passenger
                            </option>

                        </select>

                    </div>



                    <!-- =========================================
                         ADMIN FIELDS
                         ========================================= -->

                    <div
                            id="adminRegisterFields"
                            style="display: none;">


                        <div class="form-group">

                            <label for="registerUsername">
                                Admin Username
                            </label>


                            <input
                                    type="text"
                                    id="registerUsername"
                                    placeholder="Enter admin username"
                                    autocomplete="username">

                        </div>


                    </div>



                    <!-- =========================================
                         PASSENGER FIELDS
                         ========================================= -->

                    <div
                            id="passengerRegisterFields"
                            style="display: none;">


                        <!-- FULL NAME -->

                        <div class="form-group">

                            <label for="registerFullName">
                                Full Name
                            </label>


                            <input
                                    type="text"
                                    id="registerFullName"
                                    placeholder="Enter your full name"
                                    autocomplete="name">

                        </div>



                        <!-- EMAIL -->

                        <div class="form-group">

                            <label for="registerEmail">
                                Email
                            </label>


                            <input
                                    type="email"
                                    id="registerEmail"
                                    placeholder="Enter your email"
                                    autocomplete="email">

                        </div>



                        <!-- PHONE -->

                        <div class="form-group">

                            <label for="registerPhone">
                                Phone Number
                            </label>


                            <input
                                    type="text"
                                    id="registerPhone"
                                    placeholder="Enter your phone number"
                                    autocomplete="tel">

                        </div>



                        <!-- ADDRESS -->

                        <div class="form-group">

                            <label for="registerAddress">
                                Address
                            </label>


                            <input
                                    type="text"
                                    id="registerAddress"
                                    placeholder="Enter your address"
                                    autocomplete="street-address">

                        </div>


                    </div>



                    <!-- =========================================
                         PASSWORD
                         ========================================= -->

                    <div class="form-group">

                        <label for="registerPassword">
                            Password
                        </label>


                        <input
                                type="password"
                                id="registerPassword"
                                placeholder="Enter password"
                                autocomplete="new-password"
                                required>

                    </div>



                    <!-- =========================================
                         CONFIRM PASSWORD
                         ========================================= -->

                    <div class="form-group">

                        <label for="registerConfirmPassword">
                            Confirm Password
                        </label>


                        <input
                                type="password"
                                id="registerConfirmPassword"
                                placeholder="Confirm password"
                                autocomplete="new-password"
                                required>

                    </div>



                    <!-- REGISTER MESSAGE -->

                    <div
                            id="registerMessage">
                    </div>



                    <!-- REGISTER BUTTON -->

                    <button
                            type="submit"
                            id="registerButton">

                        Register

                    </button>


                    <!-- BACK TO LOGIN -->

                    <button
                            type="button"
                            id="backToLoginButton"
                            class="back-login-button">

                        ← Back to Login

                    </button>


                </form>


            </div>


        </div>


    </div>


</div>



<script
        src="/js/login.js?v=30">
</script>


</body>

</html>
