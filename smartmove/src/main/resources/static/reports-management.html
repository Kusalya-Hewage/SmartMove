<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
          name="viewport"
          content="width=device-width, initial-scale=1.0">

  <title>
    SmartMove - Reports
  </title>


  <!-- =====================================================
       REPORTS CSS
       ===================================================== -->

  <link
          rel="stylesheet"
          href="/css/reports-management.css?v=20">

</head>


<body>


<div class="reports-page">


  <!-- =====================================================
       HEADER
       ===================================================== -->

  <header class="reports-header">


    <!-- BRAND -->

    <div class="reports-brand">

      <div class="reports-logo">
        SM
      </div>


      <div>

        <h1>
          SmartMove
        </h1>

        <p>
          Business Reports
        </p>

      </div>

    </div>


    <!-- HEADER ACTIONS -->

    <div class="header-actions">


      <div class="admin-info">

        <strong id="adminUsername">
          Admin
        </strong>

        <small>
          Administrator
        </small>

      </div>


      <button
              type="button"
              id="backToAdminButton"
              class="secondary-button">

        Back to Admin Dashboard

      </button>

    </div>


  </header>



  <!-- =====================================================
       MAIN
       ===================================================== -->

  <main class="reports-main">


    <!-- =================================================
         PAGE HEADING
         ================================================= -->

    <div class="page-heading">

      <h2>
        SmartMove Reports
      </h2>

      <p>
        View transport operations and business information
      </p>

    </div>



    <!-- =================================================
         PASSENGER SELECTOR
         ================================================= -->

    <div
            id="passengerSelector"
            class="passenger-selector"
            style="display: none;">


      <div class="passenger-select-group">

        <label for="reportPassengerId">

          Select Passenger

        </label>


        <select
                id="reportPassengerId">

          <option value="">
            Select Passenger
          </option>

        </select>

      </div>


      <button
              type="button"
              class="primary-button"
              id="loadPassengerReportButton">

        View Report

      </button>


    </div>



    <!-- =================================================
         REPORT CARDS
         ================================================= -->

    <div class="report-grid">


      <!-- =============================================
           MOST USED ROUTES
           ============================================= -->

      <button
              type="button"
              class="report-card"
              data-report="most-used-routes">


        <div class="report-icon">
          R
        </div>


        <div>

          <strong>
            Most Used Routes
          </strong>

          <span>
                        Route usage and ticket counts
                    </span>

        </div>


      </button>



      <!-- =============================================
           REVENUE BY ROUTE
           ============================================= -->

      <button
              type="button"
              class="report-card"
              data-report="revenue-by-route">


        <div class="report-icon">
          Rs
        </div>


        <div>

          <strong>
            Revenue by Route
          </strong>

          <span>
                        Revenue generated by each route
                    </span>

        </div>


      </button>



      <!-- =============================================
           REVENUE BY MONTH
           ============================================= -->

      <button
              type="button"
              class="report-card"
              data-report="revenue-by-month">


        <div class="report-icon">
          M
        </div>


        <div>

          <strong>
            Revenue by Month
          </strong>

          <span>
                        Monthly ticket revenue
                    </span>

        </div>


      </button>



      <!-- =============================================
           PASSENGER TRAVEL HISTORY
           ============================================= -->

      <button
              type="button"
              class="report-card"
              data-report="passenger-travel-history">


        <div class="report-icon">
          P
        </div>


        <div>

          <strong>
            Passenger Travel History
          </strong>

          <span>
                        View a passenger's trip history
                    </span>

        </div>


      </button>



      <!-- =============================================
           VEHICLE MAINTENANCE
           ============================================= -->

      <button
              type="button"
              class="report-card"
              data-report="vehicle-maintenance-cost">


        <div class="report-icon">
          V
        </div>


        <div>

          <strong>
            Vehicle Maintenance Cost
          </strong>

          <span>
                        Vehicle maintenance expenses
                    </span>

        </div>


      </button>



      <!-- =============================================
           DRIVER PERFORMANCE
           ============================================= -->

      <button
              type="button"
              class="report-card"
              data-report="driver-performance">


        <div class="report-icon">
          D
        </div>


        <div>

          <strong>
            Driver Performance
          </strong>

          <span>
                        Driver trip performance
                    </span>

        </div>


      </button>



      <!-- =============================================
           ROUTE RATINGS
           ============================================= -->

      <button
              type="button"
              class="report-card"
              data-report="route-ratings">


        <div class="report-icon">
          ★
        </div>


        <div>

          <strong>
            Route Ratings
          </strong>

          <span>
                        Passenger ratings by route
                    </span>

        </div>


      </button>



      <!-- =============================================
           PAYMENT SUMMARY
           ============================================= -->

      <button
              type="button"
              class="report-card"
              data-report="payment-summary">


        <div class="report-icon">
          P
        </div>


        <div>

          <strong>
            Payment Summary
          </strong>

          <span>
                        Payment methods and totals
                    </span>

        </div>


      </button>


    </div>



    <!-- =================================================
         RESULT PANEL
         ================================================= -->

    <section class="result-panel">


      <!-- RESULT HEADER -->

      <div class="result-header">


        <div>

          <h3 id="reportTitle">
            Report Result
          </h3>


          <p id="reportDescription">
            Select a report above
          </p>

        </div>


        <button
                type="button"
                class="secondary-button"
                id="refreshReportButton">

          Refresh

        </button>


      </div>



      <!-- =================================================
           REPORT RESULT
           ================================================= -->

      <div id="reportResult">


        <!-- EMPTY STATE -->

        <div class="empty-state">


          <div class="empty-icon">
            R
          </div>


          <h3>
            Select a Report
          </h3>


          <p>
            Choose one of the reports above
            to view the results.
          </p>


        </div>


      </div>


    </section>


  </main>


</div>



<!-- =========================================================
     REPORTS JAVASCRIPT
     ========================================================= -->

<script
        src="/js/reports-management.js?v=20">
</script>


</body>

</html>
